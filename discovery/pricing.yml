pricing:
  currency: USD
  pain_value_per_month: 100   # величина боли в месяц
  how: Через деньги, которые уже тратят на исправление ошибок у репетитора, у собеседника 1 это 60–70 $ в месяц, у собеседника 5 около 140 $ в месяц, медиана около 100 $
  price: 12                   # 12% от боли, коридор 10–20 $
  users_month_3: 12           # платящих к третьему месяцу
  revenue_month_3: 144        # 12 * 12
  evidence:
    - source: interviews/01-respondent.md
      quote: 60 -70 долларов тратил на репетитора
    - source: interviews/05-respondent.md
      quote: Получается, у меня выходит 10 часовых занятий где -то 310 -320 долларов
    - source: interviews/05-respondent.md
      quote: растягиваю, получается, на два месяца, на два с половиной месяца мне этого хватает

# Оговорка: сумму в месяц назвали только двое, и собеседник 5 платит
# за разговорную практику, а не только за слова. Боль может быть завышена.

# Откуда 12 платящих к третьему месяцу (догадка, проверить):
# 2–3 из 9 собеседников, с кем есть связь в Telegram.
# Около 10 из 3–4 чатов об эмиграции: пост с личной историей увидят около 1000 человек,
# 5% попробуют (50 человек), 20% из них заплатят (10 человек).
# Рекламе не доверяют, выбирают по рекомендациям (находка trust-recommendations),
# поэтому ставка на чаты и сарафан, а не на рекламу.

# Сравнение с прямыми конкурентами (competitors.md):
# 12 $ дороже LinguaLeo (7,99–9,99 $ в месяц) и на уровне Quizlet (11,99 $ в месяц).
# Это оправдано тем, что тренажёр разбирает своё предложение со словом
# и объясняет ошибку на русском, а LinguaLeo и Quizlet этого не делают.
# При этом цена в 5–10 раз ниже репетитора.
